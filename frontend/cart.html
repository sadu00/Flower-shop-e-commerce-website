<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Flora & Fleur</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 700px;">
        <div class="d-flex justify-content-between align-items-center">
            <h2>Your Shopping Cart</h2>
            <a href="index.html" class="btn btn-outline-primary">Shop</a>
        </div>

        <!-- Dynamic Cart Items List -->
        <div id="cartItems" class="list-group my-3"></div>
        <h4>Total: ৳<span id="totalPrice">0</span></h4>

        <!-- Checkout Form -->
        <div class="card p-4 mt-4 shadow-sm">
            <h5>Delivery & Payment (Demo)</h5>
            <input type="text" id="address" class="form-control mb-2" placeholder="Delivery Address" required>
            <input type="text" id="phone" class="form-control mb-2" placeholder="Contact Phone" required>
            <select id="paymentMethod" class="form-select mb-2">
                <option value="bKash">bKash</option>
                <option value="Nagad">Nagad</option>
                <option value="Card">Card</option>
                <option value="COD">COD</option>
            </select>
            <input type="text" id="paymentInfo" class="form-control mb-3" placeholder="Demo transaction/reference (not needed for COD)">
            <button class="btn btn-success w-100" onclick="placeOrder()">Complete Order</button>
        </div>
    </div>

    <!-- JavaScript Logical Implementation -->
    <script>
        const API_URL = 'http://localhost:5000/api';
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // Load & Render Cart Items
        function loadCart() {
            const cartItems = document.getElementById('cartItems');
            const totalPrice = document.getElementById('totalPrice');
            let total = 0;

            if (cart.length > 0) {
                cartItems.innerHTML = cart.map((item, index) => {
                    const qty = item.qty || 1;
                    const itemTotal = item.price * qty;
                    total += itemTotal;

                    return `
                        <div class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${item.title}</strong><br>
                                <small class="text-muted">৳${item.price} × ${qty} = ৳${itemTotal}</small>
                            </div>
                            <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">Remove</button>
                        </div>
                    `;
                }).join('');
            } else {
                cartItems.innerHTML = '<div class="list-group-item text-muted">Your cart is empty.</div>';
            }

            totalPrice.innerText = total;
        }

        // Remove item from cart
        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }

        // Place order to backend server
        async function placeOrder() {
            const token = localStorage.getItem('token');
            const address = document.getElementById('address').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const paymentMethod = document.getElementById('paymentMethod').value;
            const paymentInfo = document.getElementById('paymentInfo').value.trim();

            if (!token) {
                alert('Please login to place an order!');
                location.href = 'login.html';
                return;
            }

            if (!cart.length) {
                return alert('Cart is empty!');
            }

            if (!address || !phone) {
                return alert('Please enter address and phone.');
            }

            const total = cart.reduce((sum, item) => sum + item.price * (item.qty || 1), 0);

            try {
                const res = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        items: cart,
                        totalAmount: total,
                        address: address,
                        phone: phone,
                        paymentMethod: paymentMethod,
                        paymentInfo: paymentInfo || 'COD'
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    alert('Order placed successfully!');
                    localStorage.removeItem('cart');
                    location.href = 'orders.html';
                } else {
                    alert(data.message || 'Order failed.');
                }
            } catch (err) {
                console.error(err);
                alert('Cannot connect to server. Make sure node server.js is running.');
            }
        }

        // Initialize cart on page load
        loadCart();
    </script>
</body>
</html>
