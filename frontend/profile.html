<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Flora & Fleur</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
            <div class="d-flex justify-content-between align-items-center">
                <h2>👤 My Profile</h2>
                <a href="index.html" class="btn btn-outline-primary">Home</a>
            </div>
            <hr>

            <!-- Profile Update Form -->
            <form onsubmit="updateProfile(event)">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control mb-3" required>

                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control mb-3" required>

                <label class="form-label">Phone</label>
                <input type="text" id="phone" class="form-control mb-3">

                <label class="form-label">Delivery Address</label>
                <textarea id="address" class="form-control mb-3" rows="3"></textarea>

                <label class="form-label">New Password</label>
                <input type="password" id="password" class="form-control mb-3" placeholder="Leave empty to keep current password">

                <button type="submit" class="btn btn-success w-100">Update Profile</button>
            </form>

            <!-- Order History & Logout Buttons -->
            <div class="d-flex gap-2 mt-3">
                <a href="orders.html" class="btn btn-outline-secondary flex-fill">Order History</a>
                <button class="btn btn-outline-danger flex-fill" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logical Implementation -->
    <script>
        const API_URL = 'http://localhost:5000/api';
        const token = localStorage.getItem('token');

        // Authentication Check
        if (!token) {
            alert('Please login first.');
            location.href = 'login.html';
        }

        // Fetch & Display Profile Data
        async function loadProfile() {
            try {
                const res = await fetch(`${API_URL}/users/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const user = await res.json();
                
                if (!res.ok) {
                    return alert(user.message || 'Failed to load profile.');
                }

                document.getElementById('name').value = user.name || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('phone').value = user.phone || '';
                document.getElementById('address').value = user.address || '';
            } catch (err) {
                console.error(err);
            }
        }

        // Update Profile Data
        async function updateProfile(e) {
            e.preventDefault();
            
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch(`${API_URL}/profile`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('userName', data.user.name);
                    localStorage.setItem('userEmail', data.user.email);
                    document.getElementById('password').value = '';
                    alert('Profile updated successfully!');
                } else {
                    alert(data.message || 'Profile update failed.');
                }
            } catch (err) {
                alert('An error occurred during update.');
            }
        }

        // Logout Functionality
        function logout() {
            localStorage.clear();
            location.href = 'login.html';
        }

        // Initialize Profile Load
        loadProfile();
    </script>
</body>
</html>
